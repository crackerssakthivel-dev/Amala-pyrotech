<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">₹3,000 Family Combo</title>
  <desc id="desc">Family celebration combo pack — ₹3,000</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a60000"/>
      <stop offset="1" stop-color="#8b0000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="36" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="744" rx="30" fill="none" stroke="#a60000" stroke-opacity=".28" stroke-width="3"/>

  <!-- decorative fireworks -->
  <g fill="none" stroke="#a60000" stroke-width="5" stroke-linecap="round" opacity=".72">
    <path d="M930 155l0-75M930 155l53-53M930 155l75 0M930 155l-53-53M930 155l-75 0M930 155l53 53M930 155l0 75M930 155l-53 53"/>
    <path d="M1015 330l0-48M1015 330l34-34M1015 330l48 0M1015 330l-34 34M1015 330l0 48M1015 330l34 34M1015 330l-48 0M1015 330l-34-34"/>
  </g>

  <!-- fireworks bursts -->
  <g fill="#a60000">
    <circle cx="930" cy="155" r="10"/>
    <circle cx="1015" cy="330" r="7"/>
    <circle cx="160" cy="145" r="7"/>
    <circle cx="230" cy="250" r="5"/>
  </g>

  <!-- header -->
  <text x="90" y="105" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="4" fill="#666">AMALA PYROTECH</text>
  <text x="90" y="180" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" fill="#1d2630">₹3,000 Family Combo</text>
  <text x="90" y="225" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#59636e">Family celebration combo pack</text>

  <!-- price badge -->
  <g filter="url(#shadow)">
    <rect x="90" y="270" width="390" height="112" rx="26" fill="url(#accent)"/>
  </g>
  <text x="125" y="310" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff" opacity=".9">COMBO PACK</text>
  <text x="125" y="355" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#fff">₹3,000</text>

  <!-- generic product silhouettes -->
  <g filter="url(#shadow)">
    <rect x="610" y="395" width="105" height="190" rx="12" fill="#d92d20"/>
    <rect x="735" y="350" width="105" height="235" rx="12" fill="#f0b429"/>
    <rect x="860" y="420" width="105" height="165" rx="12" fill="#1769aa"/>
    <rect x="985" y="375" width="75" height="210" rx="12" fill="#16835b"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="800" fill="#fff">
    <text x="662" y="485" font-size="18">FAMILY</text>
    <text x="787" y="465" font-size="18">FESTIVE</text>
    <text x="912" y="500" font-size="18">FUN</text>
    <text x="1022" y="475" font-size="15">JOY</text>
  </g>

  <!-- spark trails -->
  <g stroke="#d6a400" stroke-width="4" stroke-linecap="round">
    <path d="M665 395 C665 340 700 315 690 270"/>
    <path d="M790 350 C790 300 820 280 810 235"/>
    <path d="M915 420 C915 370 945 350 938 305"/>
  </g>

  <!-- footer -->
  <rect x="90" y="650" width="970" height="2" fill="#d8dee5"/>
  <text x="90" y="700" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#313b45">Quality Sivakasi Crackers &amp; Fireworks</text>
  <text x="90" y="735" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#69737d">Available options may vary • Explore the catalogue for current products and prices</text>
</svg>
